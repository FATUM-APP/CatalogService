spring:
  application:
    name: CatalogService
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
    fatum.catalog.exception: DEBUG

cognito:
  token-url: ${TOKEN_URL:https://us-east-19qukvptss.auth.us-east-1.amazoncognito.com/oauth2/token}
  client-id: ${COGNITO_M2M_CLIENT_ID}
  client-secret: ${COGNITO_M2M_CLIENT_SECRET}
  scope: api.catalog/read

fatum:
  base-url: ${BASE_URL:https://btx2xtbb3a.execute-api.us-east-1.amazonaws.com}
  sqs:
    catalog-events-queue-name: ${QUEUE_NAME:fatum-catalog-queue}
  storage:
    enabled: true
    base-url: ${FILE_SERVICE_URL:http://localhost:8081}
    internal-secret: ${FILE_SERVICE_SECRET:}
    connect-timeout: 2s
    read-timeout: 20s

catalog:
  images:
    storage-route: catalog-service:photo
  categories:
    logo-route: catalog-service:category-logo
  realtime:
    enabled: ${REALTIME_ENABLED:true}
    endpoint: ${REALTIME_ENDPOINT:/ws/catalog}
    # Fallback para proxies que no permiten upgrade a WebSocket. Vacío = desactivado.
    sock-js-endpoint: ${REALTIME_SOCKJS_ENDPOINT:/ws/catalog-sockjs}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:*}
    heartbeat:
      interval: ${REALTIME_HEARTBEAT_MS:25000}
    limits:
      message-size: 65536
      send-buffer-size: 524288
      send-time-limit: 10000
    broker:
      # SIMPLE = broker en memoria (una sola instancia). RELAY = STOMP relay a RabbitMQ/Artemis.
      mode: ${REALTIME_BROKER_MODE:SIMPLE}
      prefixes:
        - /topic
        - /queue
      relay:
        host: ${REALTIME_RELAY_HOST:localhost}
        port: ${REALTIME_RELAY_PORT:61613}
        client-login: ${REALTIME_RELAY_CLIENT_LOGIN:guest}
        client-passcode: ${REALTIME_RELAY_CLIENT_PASSCODE:guest}
        system-login: ${REALTIME_RELAY_SYSTEM_LOGIN:guest}
        system-passcode: ${REALTIME_RELAY_SYSTEM_PASSCODE:guest}
        virtual-host: ${REALTIME_RELAY_VIRTUAL_HOST:}
    auth:
      # false = cualquiera puede decir "soy este usuario" en el CONNECT (como hoy los endpoints REST).
      # true  = exige access token válido (Cognito u otro OIDC) en el frame CONNECT.
      enabled: ${REALTIME_AUTH_ENABLED:false}
      # JWT = valida el access token de Cognito contra el JWKS.
      # GATEWAY_HEADER = confía en un borde que ya validó el token (X-User-Id).
      mode: ${REALTIME_AUTH_MODE:JWT}
      public-topic-patterns:
        - /topic/calendar/**
      allowed-send-patterns: []
      max-subscriptions-per-session: 30
      jwt:
        issuer-uri: ${COGNITO_ISSUER_URI:}
        jwk-set-uri: ${COGNITO_JWK_SET_URI:}
        principal-claim: ${REALTIME_PRINCIPAL_CLAIM:sub}
        accepted-audiences: []
      gateway-header:
        name: X-User-Id
    calendar:
      # Si un cambio cubre más días que esto se envía INVALIDATE en vez de un parche enorme.
      max-patch-days: 62
