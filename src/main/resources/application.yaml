spring:
  application:
    name: CatalogService
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
    fatum.catalog.exception: DEBUG

cognito:
  token-url: ${TOKEN_URL:https://us-east-19qukvptss.auth.us-east-1.amazoncognito.com/oauth2/token}
  client-id: ${COGNITO_M2M_CLIENT_ID}
  client-secret: ${COGNITO_M2M_CLIENT_SECRET}
  scope: api.catalog/read

fatum:
  base-url: ${BASE_URL:https://btx2xtbb3a.execute-api.us-east-1.amazonaws.com}
  sqs:
    catalog-events-queue-name: ${QUEUE_NAME:fatum-catalog-queue}
  storage:
    enabled: true
    base-url: ${FILE_SERVICE_URL:http://localhost:8081}
    internal-secret: ${FILE_SERVICE_SECRET:}
    connect-timeout: 2s
    read-timeout: 20s

catalog:
  images:
    storage-route: catalog-service:photo
  categories:
    logo-route: catalog-service:category-logo

aws:
  region: ${AWS_REGION:us-east-1}
  eventbridge:
    # ARN del bus al que se publican los hechos de órdenes.
    # Si queda vacío no se publica nada (útil en local).
    bus-arn: ${EVENTBRIDGE_BUS_ARN:}

app:
  security:
    # SECURITY_ENABLED=false deja la API abierta para desarrollo local.
    enabled: ${SECURITY_ENABLED:true}
    issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Canal en tiempo real (SSE) para que la GUI vea las órdenes cambiar sin recargar.
  realtime:
    enabled: true
    timeout-ms: 1800000
    # Debe ser menor que el idle timeout del ALB (60 s por defecto).
    heartbeat-ms: 20000
    max-connections-per-user: 5
